workflows:
  # ─────────────────────────────────────────────
  # ANDROID — TESTING (develop branch → debug APK)
  # ─────────────────────────────────────────────
  android-testing:
    name: Android Test Build
    max_build_duration: 60
    triggering:
      events: []             # manual only
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - rohit@vizsoft.in
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # iOS — NO CODE SIGNING (no certificates needed)
  # ─────────────────────────────────────────────
  ios-unsigned:
    name: iOS Test Build (no signing)
    max_build_duration: 60
    triggering:
      events: []             # manual only
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - flutter_drive.log

  # ─────────────────────────────────────────────
  # iOS — SIGNED IPA
  # Only usable once you have:
  #   1. Codemagic > Teams > Integrations > App Store Connect
  #      -> API key named exactly: azyaa_asc
  #   2. Bundle ID com.azya.app registered on that Apple Developer account
  #   3. A valid distribution certificate for that account
  # ─────────────────────────────────────────────
  ios-signed:
    name: iOS Signed Build (needs App Store Connect key)
    max_build_duration: 60
    integrations:
      app_store_connect: azyaa_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.azya.app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/build/ios_signing/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rohit@vizsoft.in
        notify:
          success: true
          failure: true
