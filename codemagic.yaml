workflows:
# ─────────────────────────────────────────────
# ANDROID — TESTING (develop branch → debug APK)
# ─────────────────────────────────────────────
 android-testing:
    name: Android Test Build
    max_build_duration: 60
    triggering:
      events: []             # manual only
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons        
        script: dart run flutter_launcher_icons
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/apk/debug/azyaa-app.apk
    publishing:
      email:
        recipients:
          - rohit@vizsoft.in
        notify:
          success: true
          failure: true
