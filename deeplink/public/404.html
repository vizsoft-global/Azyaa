<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azyaa</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg: #faf9f7; --fg: #1c1a17; --muted: #6b665e; --line: #e4e0d8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141312; --fg: #f2efe9; --muted: #a39d93; --line: #2e2b27; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; text-align: center; }
  main { max-width: 380px; }
  .brand { letter-spacing: .28em; font-size: 13px; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; gap: 12px; }
  a { flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p class="brand">Azyaa</p>
  <h1>This link does not lead anywhere</h1>
  <p>It may have been cut short when it was copied. Ask for it again, or get the app below.</p>
  <div class="row">
    <a href="https://apps.apple.com/us/app/azyaa/id6743427685">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.azya.app">Google Play</a>
  </div>
</main>
</body>
</html>
